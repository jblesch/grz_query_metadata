[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grz_query_metadata"
version = "1.1.0"
description = "Survey which metadata values are actually used across GRZ submissions"
authors = [
    { name = "Jochen Blesch" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2",
    "pyyaml",
    "odfpy",
]

[project.urls]
"Homepage" = "https://github.com/jblesch/grz_query_metadata"

[project.scripts]
grz-survey-metadata = "grz_query_metadata.survey:main"
grz-aggregate-surveys = "grz_query_metadata.aggregate:main"

[dependency-groups]
dev = [
    "tox>=4",
    "tox-uv",
]
test = [
    "pytest>=8,<9",
    "pytest-xdist",
    "pytest-mock",
    "pytest-cov",
    "pytest-sugar",
]
lint = [
    "ruff",
    "mypy",
    "types-pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/grz_query_metadata"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line-too-long
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "SIM", "PLR", "F811", "F841"]
"__init__.py" = ["F401"]

[tool.tox]
requires = ["tox>=4", "tox-uv"]
env_list = ["format-check", "lints", "typecheck", "py3.12", "py3.13"]
isolated_build = true

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
description = "run unit tests"
dependency_groups = ["test"]
commands = [["pytest", { replace = "posargs", default = ["tests"], extend = true }]]

[tool.tox.env."format-check"]
runner = "uv-venv-lock-runner"
skip_install = true
dependency_groups = ["lint"]
commands = [["ruff", "format", "--check", "."]]

[tool.tox.env."lints"]
runner = "uv-venv-lock-runner"
skip_install = true
dependency_groups = ["lint"]
commands = [["ruff", "check", "."]]

[tool.tox.env."typecheck"]
runner = "uv-venv-lock-runner"
dependency_groups = ["lint"]
commands = [["mypy", "src/grz_query_metadata"]]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
