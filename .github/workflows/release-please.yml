name: Release Please

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  UV_VERSION: "0.11.6"
  UV_PYTHON_PREFERENCE: "managed"

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs: ${{ steps.release.outputs.prs }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  refresh-lock:
    name: Refresh uv.lock on release PR
    needs: release-please
    if: ${{ needs.release-please.outputs.prs != '' && needs.release-please.outputs.prs != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release PR branch
        uses: actions/checkout@v4
        with:
          # fromJSON instead of echo|jq in a shell step: the PR JSON contains
          # changelog text, and any quote in a commit message would break (or
          # inject into) an interpolated bash script.
          ref: ${{ fromJSON(needs.release-please.outputs.prs)[0].headBranchName }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Refresh uv.lock
        run: |
          uv lock
          if git diff --quiet uv.lock; then
            echo "uv.lock already in sync — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh uv.lock for release"
          git push
